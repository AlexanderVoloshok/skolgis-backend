server {
    listen       4300;
    listen       [::]:4300;
    server_name  _;
    root         /usr/share/nginx/html;

    client_max_body_size 1g;

    include /etc/nginx/conf.d/locations/*.conf;

    error_page 404 /404.html;
    location = /404.html {
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
    }
}
