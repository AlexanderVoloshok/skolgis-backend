version: "1"
networks:
  skolgis-project_sklkv:
    external: true
    name: skolgis-project_sklkv
services:
  backend:
    networks:
      - skolgis-project_sklkv
    build: .
    container_name: skolgis-backend
    ports:
      - "5000:5000"
    restart: on-failure
    environment:
      - GEOSERVER_ADMIN_USER=skolkovoroot
      - GEOSERVER_ADMIN_PASSWORD=MEWt4wneYVZy2cPvr3j4
      - GEOSERVER_WORKSPACE=skolkgis
      - GEOSERVER_STORE_NAME=skolgis_postgis
      - PROXY_BASE_URL=http://192.168.45.237/geoserver/
    volumes:
      - ./src/files:/skolgis_backend/src/files
  geoserver:
    image: kartoza/geoserver:2.20.1
    container_name: skolgis-geoserver
    restart: on-failure
    networks:
      - skolgis-project_sklkv
    volumes:
      - geoserver_data:/opt/geoserver/data_dir
    ports:
      - "8081:8080"
    logging:
      options:
        max-size: 10m
    environment:
      - GEOSERVER_DATA_DIR=/opt/geoserver/data_dir
      - GEOWEBCACHE_CACHE_DIR=/opt/geoserver/data_dir/gwc
      - GEOSERVER_ADMIN_USER=skolkovoroot
      - GEOSERVER_ADMIN_PASSWORD=MEWt4wneYVZy2cPvr3j4
      - GEOSERVER_WORKSPACE=skolkgis
      - GEOSERVER_STORE_NAME=skolgis_postgis
      - INITIAL_MEMORY=1G
      - MAXIMUM_MEMORY=2G
      # убираем ПУСТОЙ HTTP_PROXY_NAME
      - HTTP_PROXY_NAME=${HTTP_PROXY_NAME}
      # фиксируем внешний базовый URL – этого достаточно
      #- PROXY_BASE_URL=http://89.223.68.75/geoserver/
      # с 4 ГБ RAM:
      - INITIAL_MEMORY=512m        # Xms
      - MAXIMUM_MEMORY=1536m       # Xmx ~ 1.5 ГБ (можно 2г, но оставь запас системе и другим контейнерам)
      # на случай если образ читает именно эти флаги:
      - JAVA_OPTS=-Xms512m -Xmx1536m -XX:+UseG1GC
      - GEOSERVER_JAVA_OPTS=-Xms512m -Xmx1536m -XX:+UseG1GC
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/geoserver/web/"]
      interval: 40s
      timeout: 10s
      retries: 7
  postgres:
    container_name: skolgis-pg
    image: postgis/postgis:17-3.5
    restart: on-failure
    networks:
      - skolgis-project_sklkv
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: uB8F3E37riRQGmxqtipj
    command: "-N 500"
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
  #nginx:
  #  image: nginx
  #  container_name: skolgis-nginx
  #  restart: on-failure
  #  networks:
  #    - sklkv
  #  volumes:
  #    - ./nginx/nginx.conf:/etc/nginx/conf.d/nginx.conf
  #    - ./nginx/locations.conf:/etc/nginx/conf.d/locations/locations.conf
  #  ports:
  #    - "4300:4300"
volumes:
  pg_data: {}
  geoserver_data: {}
